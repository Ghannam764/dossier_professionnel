<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Zoning</title>
        
        <style>   
            
            /*ex. Découpage de la page en zones logiques et visuelles
            Utilisation de Flexbox pour la disposition des éléments
            Maîtrise des dimensions en vh/vw
            Capacité à créer des mises en page responsives
            Séparation visuelle pour une structure plus lisible */


            /* css*/
            /* Découpage de la page en zones logiques et visuelles :
            La structure est divisée en header, 3 colonnes principales, et deux sous-zones dans la colonne centrale. */

            header{
                height: 10vh;
                background-color: red;
            }

            /* Utilisation de Flexbox pour la disposition des éléments :
            Le main utilise Flexbox pour aligner les 3 colonnes horizontalement. */

            main{
                display: flex;
            }

            /* dimensions en vh/vw :
            Les largeurs et hauteurs sont définies en unités de viewport (vw/vh). */

            #colonne1, #colonne3{
                width: 15vw;
                background-color: blue;
            }
            #colonne2{
                width: 70vw;
            }
            #milieuHaut{
                height: 80vh;
                display: flex;
            }
            #milieuBas{
                height: 10vh;
                background-color: yellow;
            }

            /* Séparation visuelle pour une structure plus lisible :
            Utilisation de couleurs contrastées et de bordures pour différencier les blocs. */

            .colonne{
                width: 20vw;
                background-color: lime;
                border-right:1px solid white;
                border-left:1px solid white
            }

            /* Mises en page responsives :
            Les colonnes latérales disparaissent sur les petits écrans et les blocs deviennent empilés. */

            @media screen and (max-width: 680px)  { 

                #colonne1, #colonne3{
                    display: none;
                }

                #colonne2{
                    height: 10vh;
                    width: 100vw;
                }
                .colonne{
                    width: 100vw;
                }

                #milieuHaut{
                    flex-wrap: wrap;
                }



            }

     



        </style>
    </head>
    <body>

        <header></header>
        <main>
            <div id="colonne1"></div>
            <div id="colonne2">
                <div id="milieuHaut">
                    <div class="colonne"></div>
                    <div class="colonne"></div>
                    <div class="colonne"></div>
                    <div class="colonne"></div>
                    <div class="colonne"></div>
                </div>
                <div id="milieuBas"></div>
            </div>
            <div id="colonne3"></div>
        </main>

    </body>
</html>
